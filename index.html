    <meta charset="UTF-8" />
    <script>
      /* Global protective shield against third-party extension injection errors (e.g. MetaMask inpage.js in iframe) */
      (function() {
        function isExtensionCrash(msg, src, err) {
          var str = (msg || '') + ' ' + (src || '') + ' ' + (err && (err.message || err.stack) || '');
          return (
            str.indexOf('chrome-extension://') !== -1 ||
            str.indexOf('moz-extension://') !== -1 ||
            str.indexOf('inpage.js') !== -1 ||
            str.indexOf('Failed to connect to MetaMask') !== -1 ||
            str.indexOf('nkbihfbeogaeaoehlefnkodbefgpgknn') !== -1
          );
        }

        // Intercept global error in capture phase before iframe reporters can receive it
        window.addEventListener('error', function(event) {
          var msg = event.message || (event.error && event.error.message);
          var src = event.filename || (event.error && event.error.stack);
          if (isExtensionCrash(msg, src, event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            console.debug('[DOMINEX Shield] Suppressed third-party extension error:', msg);
            return true;
          }
        }, true);

        // Intercept unhandled promise rejections in capture phase
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = reason && (reason.message || (typeof reason === 'string' ? reason : ''));
          var stack = reason && reason.stack;
          if (isExtensionCrash(msg, stack, reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            console.debug('[DOMINEX Shield] Suppressed third-party extension unhandled rejection:', msg);
            return true;
          }
        }, true);
      })();
    </script>
